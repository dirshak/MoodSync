<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MoodSync</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" sizes="any" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}" />
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/logo.png') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app">
    <button id="sidebarToggle" class="sidebar-toggle" aria-label="Toggle sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>

    <div id="sidebarScrim" class="sidebar-scrim"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img class="brand-mark" src="{{ url_for('static', filename='img/logo.png') }}" alt="MoodSync" />
          <span class="brand-name">MoodSync</span>
        </div>
        <button id="newChatBtn" class="new-chat-btn">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><path d="M7.5 2v11M2 7.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          New chat
        </button>
      </div>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
      <div class="chat-view" id="chatView">
        <div class="empty-state" id="emptyState">
          <div class="empty-glow"></div>
          <h1>Tell me how you're feeling</h1>
          <p>Describe your day, your mood, whatever's on your mind — I'll turn it into a short piece of music that matches.</p>
        </div>
        <div class="messages" id="messages"></div>
      </div>

      <form class="composer" id="composer">
        <textarea id="messageInput" placeholder="I've had a..." rows="1" maxlength="2000"></textarea>
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M2 9l14-7-5 14-3-5-6-2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
      </form>
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
